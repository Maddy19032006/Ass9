apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-portal-deployment
  labels:
    app: university-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: university-portal
    spec:
      containers:
      - name: portal-container
        image: <your-dockerhub-username>/university-portal:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: university-portal-service
spec:
  type: NodePort
  selector:
    app: university-portal
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
